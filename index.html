<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ranges Expresso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <button class="menu">☰</button>
      <div>
        <h1>Ranges Expresso</h1>
        <p>3-max • Préflop • Base solver 15bb</p>
      </div>
      <label>Profondeur
        <select id="depth">
          <option>15</option><option>12</option><option>10</option>
          <option>8</option><option>6</option><option>5</option>
        </select> BB
      </label>
    </header>

    <section class="layout">
      <div class="card table-card">
        <div class="poker-table">
          <div class="felt"><span>Pot : 1.5bb</span></div>
          <button class="seat btn" data-pos="BTN">BTN</button>
          <button class="seat bb" data-pos="BB">BB<br><small>1bb</small></button>
          <button class="seat sb active" data-pos="SB">SB<br><small>0.5bb</small></button>
        </div>
      </div>

      <aside class="card info">
        <h2>Range Info</h2>
        <div class="big" id="infoDepth">15bb deep</div>
        <hr>
        <p>Position sélectionnée</p>
        <strong id="position">SB</strong>
        <p class="hint">Clique sur un siège pour changer de spot.</p>
      </aside>

      <div class="card range-card">
        <div class="range-head">
          <div><strong id="spotTitle">SB OPEN</strong><span id="rangePct"></span></div>
          <div class="legend-mini"><i class="fold"></i>Fold <i class="limp"></i>Limp <i class="raise"></i>Raise <i class="allin"></i>All-in</div>
        </div>
        <div id="grid" class="grid"></div>
      </div>

      <aside class="card actions">
        <h2 id="actionTitle">SB OPENS</h2>
        <div id="legend"></div>
        <div class="selected-hand" id="selectedHand">AA</div>
        <div id="detail"></div>
        <button id="simplify">Simplifier la range</button>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
