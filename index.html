<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c1118" />
  <title>Ranges Expresso V2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">POKER 3-MAX • EXPRESSO</div>
        <h1>Ranges Expresso</h1>
        <p class="subtitle">Prototype V2 — interface de travail préflop 5 à 15 BB</p>
      </div>
      <div class="status-pill">V2</div>
    </header>

    <section class="controls card">
      <div class="control">
        <label for="format">Format</label>
        <select id="format">
          <option value="3max">3-handed</option>
        </select>
      </div>

      <div class="control">
        <label for="stack">Profondeur effective</label>
        <select id="stack"></select>
      </div>

      <div class="control">
        <label for="position">Position</label>
        <select id="position">
          <option value="BTN">BTN</option>
          <option value="SB">SB</option>
          <option value="BB">BB</option>
        </select>
      </div>

      <div class="control">
        <label for="spot">Situation</label>
        <select id="spot"></select>
      </div>
    </section>

    <section class="summary-grid">
      <div class="metric card">
        <span>Range jouée</span>
        <strong id="playedPct">—</strong>
      </div>
      <div class="metric card">
        <span>Action dominante</span>
        <strong id="dominantAction">—</strong>
      </div>
      <div class="metric card">
        <span>Statut</span>
        <strong id="dataStatus">—</strong>
      </div>
    </section>

    <section class="workspace">
      <section class="card range-card">
        <div class="range-head">
          <div>
            <div class="section-kicker" id="spotTitle">BTN • 15 BB • First in</div>
            <h2>Range 13 × 13</h2>
          </div>
          <div class="legend">
            <span><i class="swatch fold"></i>Fold</span>
            <span><i class="swatch limp"></i>Limp</span>
            <span><i class="swatch raise"></i>Raise</span>
            <span><i class="swatch shove"></i>All-in</span>
            <span><i class="swatch mixed"></i>Mix</span>
          </div>
        </div>

        <div id="matrix" class="matrix" aria-label="Matrice des mains de poker"></div>
      </section>

      <aside class="side-column">
        <section class="card detail-card">
          <div class="section-kicker">DÉTAIL DE LA MAIN</div>
          <div id="handDetail" class="hand-detail">
            <div class="big-hand">—</div>
            <p>Clique sur une case de la matrice.</p>
          </div>
        </section>

        <section class="card breakdown-card">
          <div class="section-kicker">RÉPARTITION</div>
          <div id="breakdown"></div>
        </section>

        <section class="card source-card">
          <div class="section-kicker">DONNÉES</div>
          <p id="sourceText"></p>
          <div id="warningBox" class="warning"></div>
        </section>
      </aside>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
